<style>
/* CSS Reset & Base */
*,
*::before,
*::after {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #181818;
    color: #f8f8f2;
}

body {
    min-height: 100vh;
    font-family: "Times New Roman", Georgia, serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;

/* Skip link for accessibility */
.skip-link {
    position: absolute;
    top: -40px;
    left: 0;
    background: #f8f8f2;
    color: #181818;
    padding: 8px 16px;
    z-index: 100;
    text-decoration: none;
    font-size: 14px;
}

.skip-link:focus {
    top: 0;
}

/* Main Content */
#main {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
}

#main > div {
    width: 100%;
    max-width: 600px;
}

/* Banner Image */
.banner {
    width: 100%;
    height: auto;
    max-width: 560px;
    display: block;
    margin: 0 auto;
}

/* Timezone Display */
#timezone {
    font-size: 18px;
    display: block;
    margin: 24px 0;
    font-variant-numeric: tabular-nums;
}

#time {
    margin-right: 8px;
}

#tz {
    color: #888;
}

/* Navigation Links */
.nav-links {
    white-space: nowrap;
    overflow-x: auto;
    display: inline-block;
    padding: 8px 0;
}

.nav-links a {
    color: #06c6ff;
    text-decoration: none;
    display: inline;
    transition: color 0.2s ease;
}

.nav-links a:hover,
.nav-links a:focus {
    color: #ffe454;
    text-decoration: underline;
    outline: none;
}

.nav-links a:focus-visible {
    outline: 2px solid #ffe454;
    outline-offset: 2px;
}

.link-separator {
    display: inline;
    margin: 0 8px;
    color: #666;
    user-select: none;
}

.line-break-mobile {
    display: none;
}

/* Contact Info */
#contact {
    position: fixed;
    right: 16px;
    bottom: 12px;
    font-size: 14px;
    color: #666;
    text-align: right;
    line-height: 1.35;
}

#contact a {
    color: #666;
    text-decoration: none;
    transition: color 0.2s ease;
}

#contact a:hover,
#contact a:focus {
    color: #f8f8f2;
}

/* Responsive Design */
@media (max-width: 640px) {
    #main {
        padding: 15px;
    }

    #timezone {
        font-size: 16px;
        margin: 20px 0;
    }

    .nav-links {
        white-space: normal;
        line-height: 1.8;
    }

    .nav-links a {
        font-size: 14px;
    }

    .link-separator {
        margin: 0 6px;
    }

    .line-break-mobile {
        display: none;
    }

    #contact {
        font-size: 12px;
        right: 12px;
        bottom: 10px;
    }
}

@media (max-width: 480px) {
    #main {
        padding: 10px;
    }

    #timezone {
        font-size: 14px;
        margin: 16px 0;
    }

    .nav-links a {
        font-size: 13px;
    }

    .link-separator {
        margin: 0 4px;
    }

    #contact {
        font-size: 11px;
        right: 10px;
        bottom: 10px;
    }
}

/* Reduced motion preference */
@media (prefers-reduced-motion: reduce) {
    * {
        transition: none !important;
        animation: none !important;
    }
}
</style>

<script>
(function() {
    'use strict';

    const formatter = new Intl.DateTimeFormat([], {
        timeZone: "Asia/Kolkata",
        hour: "numeric",
        minute: "numeric",
        second: "numeric",
        timeZoneName: "short"
    });

    function updateTime() {
        const timeEl = document.getElementById("time");
        const tzEl = document.getElementById("tz");

        if (!timeEl || !tzEl) return;

        const parts = formatter.formatToParts(new Date());

        timeEl.textContent = parts
            .filter(part => part.type !== "timeZoneName")
            .map(part => part.value)
            .join("");

        const tzPart = parts.find(part => part.type === "timeZoneName");
        tzEl.textContent = tzPart ? tzPart.value : "";
    }

    // Initialize immediately and update every second
    updateTime();
    setInterval(updateTime, 1000);
})();
</script>
